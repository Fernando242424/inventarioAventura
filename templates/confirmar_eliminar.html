{% extends 'base.html' %}
{% block title %}Eliminar{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Eliminar registro</h1>
<div class="card shadow mb-4"><div class="card-body">
    <p>¿Seguro que deseas eliminar «{{ objeto }}»? Esta acción no se puede deshacer.</p>
    <form method="post">{% csrf_token %}
        <button class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url volver %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div></div>
{% endblock %}
