{% extends 'base_login.html' %}
{% block title %}Aventuras del Sur{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="p-5 text-center">
            <h1 class="h4 text-gray-900 mb-2"><i class="fas fa-mountain text-success"></i> Aventuras del Sur</h1>
            <p class="text-gray-600 mb-4">Ecoparque y Reserva Natural</p>
            {% if user.is_authenticated %}
                <a href="{% url 'panel' %}" class="btn btn-success btn-block">Ir a mi panel</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-success btn-block">Ingresar</a>
                <a href="{% url 'registro' %}" class="btn btn-outline-secondary btn-block">Crear cuenta</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
