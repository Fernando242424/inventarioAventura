{% extends 'base_login.html' %}
{% block title %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="p-5">
            <div class="text-center"><h1 class="h4 text-gray-900 mb-4">Crear cuenta de turista</h1></div>
            <form method="post" novalidate>
                {% csrf_token %}
                {% for f in form %}
                <div class="form-group">
                    <label class="small mb-1" for="{{ f.id_for_label }}">{{ f.label }}</label>
                    {{ f }}
                    {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
                </div>
                {% endfor %}
                <button class="btn btn-success btn-block" type="submit">Registrar cuenta</button>
            </form>
            <hr>
            <div class="text-center"><a class="small" href="{% url 'login' %}">¿Ya tienes cuenta? Ingresa</a></div>
        </div>
    </div>
</div>
{% endblock %}
